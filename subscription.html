<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>订阅管理 · 洪涝可视化（vibe）</title>
  <script>
    (function() {
      'use strict';
      // fragment 不发给服务器；读取后立即移出地址栏，不写入本地存储。
      var fragment = window.location.hash;
      var cleared = false;
      try {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        cleared = true;
      } catch (e) { /* 无法清理地址时不允许提交令牌。 */ }
      var params = new URLSearchParams(fragment.slice(1));
      fragment = '';
      var action = '';
      var token = '';
      if (cleared && params.getAll('confirm').length === 1 && !params.has('unsubscribe')) {
        action = 'confirm'; token = params.get('confirm');
      } else if (cleared && params.getAll('unsubscribe').length === 1 && !params.has('confirm')) {
        action = 'unsubscribe'; token = params.get('unsubscribe');
      }
      params = null;

      document.addEventListener('DOMContentLoaded', function() {
        var title = document.getElementById('actionTitle');
        var message = document.getElementById('message');
        var button = document.getElementById('confirmButton');
        var busy = false;
        if (!token || !action) {
          message.textContent = '未找到有效的订阅操作令牌。请从确认邮件或退订邮件中的完整链接进入；本页不会自动变更订阅。';
          return;
        }
        var unsubscribe = action === 'unsubscribe';
        title.textContent = unsubscribe ? '确认退订预警' : '确认预警订阅';
        message.textContent = unsubscribe ? '点击下方按钮后才会取消此邮件链接对应的订阅。' :
          '点击下方按钮确认邮箱。确认后，仅在服务可用且管理员发布匹配分区的预警时通知，不保证立即发送。';
        button.textContent = unsubscribe ? '确认退订' : '确认订阅';
        button.disabled = false;
        button.onclick = function() {
          if (busy || !token) return;
          busy = true;
          button.disabled = true;
          message.textContent = '正在提交，请稍候...';
          // 只在用户点击后 POST；邮件预览/页面 GET 不触发变更。
          fetch('/api/subscribe/' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
          }).then(function(r) {
            return r.json().then(function(d) {
              if (!r.ok || !d || d.ok !== true || typeof d.note !== 'string') {
                throw new Error((d && d.error) || '操作未成功，请重新打开邮件链接后重试');
              }
              return d;
            });
          }).then(function(d) {
            token = '';
            action = '';
            message.textContent = d.note;
            button.textContent = '已完成';
            busy = false;
          }).catch(function(e) {
            message.textContent = '操作失败: ' + e.message;
            busy = false;
            button.disabled = !token;
          });
        };
        window.addEventListener('pagehide', function() {
          token = '';
          action = '';
          button.disabled = true;
        });
      });
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center;
      font-family: 'Microsoft YaHei', sans-serif; color: #e6f1ff; background: #0d2540; }
    main { width: 100%; max-width: 480px; padding: 28px; border: 1px solid #41627f;
      border-radius: 14px; background: #102c48; }
    h1 { margin: 0 0 18px; font-size: 22px; color: #4fc3f7; }
    p { line-height: 1.8; font-size: 14px; overflow-wrap: anywhere; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #0288d1;
      color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    a { color: #81d4fa; }
    .note { color: #a8bfd3; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1 id="actionTitle">预警订阅管理</h1>
    <p id="message" role="status" aria-live="polite">正在读取邮件链接...</p>
    <button id="confirmButton" type="button" disabled>确认操作</button>
    <noscript><p>请启用 JavaScript 后重新打开邮件中的完整链接。打开本页不会自动确认或退订。</p></noscript>
    <p class="note">链接中的令牌是一次性操作凭据，请勿转发。地址栏已清理令牌；如需重试或刷新，请重新打开邮件中的链接。</p>
    <a href="mobile.html">返回公众报汛与订阅页面</a>
  </main>
</body>
</html>
