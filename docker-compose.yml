services:
  floodviz:
    build: .
    ports:
      - "127.0.0.1:${FLOOD_PORT:-8001}:8001"
    environment:
      # Empty DB configuration permits local-file fallback, no default password.
      FLOOD_DB_HOST: "${FLOOD_DB_HOST:-}"
      FLOOD_DB_PORT: "${FLOOD_DB_PORT:-5432}"
      FLOOD_DB_NAME: "${FLOOD_DB_NAME:-}"
      FLOOD_DB_USER: "${FLOOD_DB_USER:-}"
      FLOOD_DB_PASSWORD: "${FLOOD_DB_PASSWORD:-}"
      FLOOD_DB_FIRST: "${FLOOD_DB_FIRST:-0}"
      # Runtime injection only; no credential is baked into Docker layers.
      FLOOD_ADMIN_PASSWORD: "${FLOOD_ADMIN_PASSWORD:-}"
      FLOOD_DEMO: "${FLOOD_DEMO:-0}"
      FLOOD_DATA_DIR: /app/state
      GEOSCENE_EXTENT_URL: "${GEOSCENE_EXTENT_URL:-}"
      GEOSCENE_DEPTH_URL: "${GEOSCENE_DEPTH_URL:-}"
    volumes:
      - flood-state:/app/state
    restart: unless-stopped

volumes:
  flood-state:
